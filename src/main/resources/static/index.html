<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PayTrack</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #2563eb;
            --navy-dark: #0f172a;
            --bg-page: #0b1329;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b1329 0%, #172554 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #f8fafc;
        }
        .login-card {
            background: #ffffff;
            color: #0f172a;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 26px;
        }
        .brand-logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 12px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }
        .brand-logo.setup-icon {
            background: linear-gradient(135deg, #059669, #065f46);
            box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.3);
        }
        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--navy-dark);
            margin: 0;
            letter-spacing: -0.5px;
        }
        .brand-sub {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        .form-control {
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #1e3a8a);
            border: none;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e3a8a);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.99);
        }
        .btn-success-custom {
            background: linear-gradient(135deg, #059669, #047857);
            border: none;
            padding: 11px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            color: #fff;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .btn-success-custom:hover {
            background: linear-gradient(135deg, #047857, #065f46);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.35);
            color: #fff;
        }
        .badge-system-info {
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Setup Card (Visible only when no users exist in database) -->
<div id="setupCard" class="login-card d-none">
    <div class="brand-header">
        <div class="brand-logo setup-icon">
            <i class="bi bi-shield-check"></i>
        </div>
        <h1 class="brand-title">System Setup</h1>
        <p class="brand-sub">Initialize your administrator account to get started</p>
    </div>

    <div class="badge-system-info">
        <i class="bi bi-info-circle me-1 text-primary"></i> Fresh installation detected. Create the primary Super Admin account.
    </div>

    <div id="setupAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

    <form id="setupForm">
        <div class="mb-3">
            <label class="form-label" for="adminFullName">Administrator Full Name</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="adminFullName" placeholder="e.g. System Administrator" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="adminEmail">Work Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="adminEmail" placeholder="name@company.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="adminUsername">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-at"></i></span>
                <input type="text" class="form-control" id="adminUsername" placeholder="Enter username" required autocomplete="username">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="adminPassword">Master Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="adminPassword" placeholder="Minimum 6 characters" required autocomplete="new-password" minlength="6">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="adminConfirmPassword">Confirm Master Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="adminConfirmPassword" placeholder="Re-enter password" required autocomplete="new-password" minlength="6">
            </div>
        </div>

        <button type="submit" class="btn btn-success-custom" id="setupBtn">
            <span id="setupBtnText"><i class="bi bi-check2-circle me-1"></i> Create Administrator Account</span>
            <span id="setupBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
    </form>
</div>

<!-- Login Card (Standard Database Authentication) -->
<div id="loginCard" class="login-card d-none">
    <div class="brand-header">
        <h1 class="brand-title">PayTrack</h1>
        <p class="brand-sub">An Automated PayTrack Management System</p>
    </div>

    <!-- Alert Messages -->
    <div id="loginSuccessAlert" class="alert alert-success d-none py-2 px-3 small" role="alert"></div>
    <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label" for="username">Username or Email</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" placeholder="Enter username or work email" required autofocus autocomplete="username">
            </div>
        </div>

        <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label mb-0" for="password">Password</label>
            </div>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
            </div>
            <span class="text-muted small" style="cursor: pointer;" onclick="alert('Please contact your System Administrator to reset your password.')">Forgot password?</span>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
            <span id="btnText">Sign In</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
    </form>
</div>

<script>
    // Toggle Password Visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const pass = document.getElementById('password');
        const icon = this.querySelector('i');
        if (pass.type === 'password') {
            pass.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            pass.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });

    // Check system setup status & active session on startup
    async function initPage() {
        try {
            const setupRes = await fetch('/api/auth/setup-status');
            if (setupRes.ok) {
                const setupData = await setupRes.json();
                const isSetup = (setupData && setupData.data && setupData.data.setupRequired !== undefined)
                    ? setupData.data.setupRequired
                    : Boolean(setupData && setupData.setupRequired);
                if (isSetup) {
                    document.getElementById('loginCard').classList.add('d-none');
                    document.getElementById('setupCard').classList.remove('d-none');
                    return;
                }
            }

            // If setup is not required, check if user is already logged in
            try {
                const userRes = await fetch('/api/auth/current-user');
                if (userRes.ok) {
                    const userData = await userRes.json();
                    if (userData.success && userData.data) {
                        const r = userData.data.role;
                        const dest = r === 'ROLE_MANAGER' ? '/app.html#manager-dashboard' : (r === 'ROLE_EMPLOYEE' ? '/app.html#employee-dashboard' : '/app.html#dashboard');
                        window.location.href = dest;
                        return;
                    }
                }
            } catch (ignore) {}

            document.getElementById('setupCard').classList.add('d-none');
            document.getElementById('loginCard').classList.remove('d-none');
        } catch (err) {
            console.warn('Startup check failed, default to login card:', err);
            document.getElementById('loginCard').classList.remove('d-none');
        }
    }

    initPage();

    // Initial Setup Form Submission
    document.getElementById('setupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertBox = document.getElementById('setupAlert');
        const btn = document.getElementById('setupBtn');
        const btnText = document.getElementById('setupBtnText');
        const btnSpinner = document.getElementById('setupBtnSpinner');

        const fullName = document.getElementById('adminFullName').value.trim();
        const email = document.getElementById('adminEmail').value.trim();
        const username = document.getElementById('adminUsername').value.trim();
        const password = document.getElementById('adminPassword').value;
        const confirmPassword = document.getElementById('adminConfirmPassword').value;

        alertBox.classList.add('d-none');

        if (password !== confirmPassword) {
            alertBox.textContent = 'Passwords do not match.';
            alertBox.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');

        try {
            const response = await fetch('/api/auth/setup-admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, email, username, password })
            });
            const res = await response.json();

            if (response.ok && res.success) {
                if (res.data && res.data.profile) {
                    localStorage.setItem('currentUser', JSON.stringify(res.data.profile));
                    localStorage.setItem('userRole', res.data.role || 'ROLE_ADMIN');
                }
                window.location.href = (res.data && res.data.redirectUrl) ? res.data.redirectUrl : '/app.html#dashboard';
            } else {
                alertBox.textContent = res.message || 'Failed to initialize administrator account.';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.textContent = 'Failed to connect to server during setup.';
            alertBox.classList.remove('d-none');
        } finally {
            btn.disabled = false;
            btnText.classList.remove('d-none');
            btnSpinner.classList.add('d-none');
        }
    });

    // Login Form Submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const alertBox = document.getElementById('loginAlert');
        const successBox = document.getElementById('loginSuccessAlert');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        alertBox.classList.add('d-none');
        successBox.classList.add('d-none');
        loginBtn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');

        const payload = {
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            rememberMe: document.getElementById('rememberMe').checked
        };

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const res = await response.json();

            if (response.ok && res.success) {
                localStorage.setItem('currentUser', JSON.stringify(res.data.profile));
                localStorage.setItem('userRole', res.data.role);
                window.location.href = res.data.redirectUrl;
            } else {
                alertBox.textContent = res.message || 'Invalid username/email or password';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.textContent = 'Server connection error. Please ensure the backend is running.';
            alertBox.classList.remove('d-none');
        } finally {
            loginBtn.disabled = false;
            btnText.classList.remove('d-none');
            btnSpinner.classList.add('d-none');
        }
    });
</script>

</body>
</html>
