# Render supplies the private PostgreSQL host details through the service
# environment. DB_URL can override the assembled URL for an external database.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# A freshly provisioned free-tier database is always empty and there is no
# production data to protect, so let Hibernate build the schema on boot.
spring.jpa.hibernate.ddl-auto=update

# Free instances have 512 MB total: keep the pool small and fail fast.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
