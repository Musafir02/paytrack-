spring.application.name=payroll-management-system
# Render injects a dynamic PORT; default keeps local behaviour unchanged
server.port=${PORT:8080}

# Import local credentials if present (application-local.properties in project root)
spring.config.import=optional:file:./application-local.properties

# Local development and Render use PostgreSQL via DB_URL/DB_USERNAME/DB_PASSWORD.
# driver-class-name and dialect are not pinned so Hibernate auto-detects from the JDBC URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payroll_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Logging
logging.level.com.payroll=INFO
logging.level.org.springframework.security=INFO